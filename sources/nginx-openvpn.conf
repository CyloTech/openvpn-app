# Each login may download only its own profile, <username>.ovpn. The install
# user also owns config.ovpn, the profile created on first boot; the
# entrypoint writes that entry to /etc/nginx/ovpn-owner.map on every boot.
# Anything else is answered as a missing file, so profile names can't be
# probed. try_files runs after auth_basic, so unauthenticated requests still
# get the login prompt.
map "$remote_user:$uri" $ovpn_profile {
	default /.ovpn-denied;
	"~^([A-Za-z0-9_.-]+):/\1\.ovpn$" /$1.ovpn;
	include /etc/nginx/ovpn-owner.map;
}

server {
	listen 80 default_server;
#	listen [::]:80 default_server ipv6only=on;

	root /configs;
	index index.php index.html index.htm;

	# Make site accessible from http://localhost/
	server_name localhost;

	# Allow larger .torrent files to upload.
	# If experiencing a "413 Request Entity Too Large" error,
	# feel free to increase this setting.
	client_max_body_size 2M;

	location / {
		# Serve only the profile the map above allows for this login.
		try_files $ovpn_profile =404;
		# Uncomment to enable naxsi on this location
		# include /etc/nginx/naxsi.rules
        auth_basic "Restricted";
        auth_basic_user_file /etc/openvpn/.htpasswd;
	}
}

