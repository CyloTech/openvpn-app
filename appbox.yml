app:
  display_name: "OpenVPN"
  publisher: "OpenVPN Inc"
  description: |
    OpenVPN is a full-featured open-source VPN solution that creates secure point-to-point or site-to-site connections. This Appbox package bundles the OpenVPN server with a web interface for downloading client configuration files.

    ## Features

    - Full OpenVPN server with TLS authentication
    - Web interface for downloading .ovpn client configuration files
    - Automatic PKI and certificate management via EasyRSA
    - User management with add, modify, and delete scripts
    - AES-256-GCM encryption with SHA384 authentication
    - Automatic IP subnet and route configuration

    ## Ideal For

    - Securely accessing your Appbox services from anywhere
    - Creating a private VPN tunnel to your server
    - Users who need a self-hosted VPN without third-party dependencies

  short_description: "Self-hosted OpenVPN server with web-based config downloads"
  icon: icon.png
  categories:
    - "Privacy"
  devsite: "https://openvpn.net"
  source_repo: "https://github.com/OpenVPN/openvpn"
  documentation_url: null

image:
  name: "openvpn"
  version: "2.6.16-1"
  tag: "2.6.16-1"

container:
  cmd: null
  user: null
  group_add: null
  memory: 0
  memory_swap: 0
  memory_reservation: 0
  cpus: 0
  init: false

  # OpenVPN requires NET_ADMIN for tun device creation and iptables rules.
  # This means the app runs as root inside the container (not UID 1000).
  cap_add: "NET_ADMIN"
  cap_drop: null
  shm_size: null
  pids_limit: null

networking:
  subdomain: "openvpn"
  is_web_app: true
  requires_domain: true
  ssl: true
  multiple_domains: false
  tcp_passthrough: false

behavior:
  app_slots: 1
  expect_callback: true
  callback_requires_auth: false
  restart_text: "All connected VPN clients will be disconnected."
  can_update: true
  update_text: "Connected VPN clients will be disconnected during the update."
  allow_downgrade: false
  ssl_restart: false

install:
  pre_description: "Choose a username and password for the VPN web interface. You will use these to download your .ovpn configuration file."
  post_description: "Your VPN server is ready! Download your .ovpn configuration file from the web interface and import it into your OpenVPN client."
  custom_description: null

ports:
  tcp:
    range: null
    dynamic: 0
  udp:
    range: "1194"
    dynamic: 0
  combined:
    range: null
    dynamic: 0

volumes:
  - source: "configs"
    destination: "/configs"
    permissions: "rw"
    uid: 0

  - source: "openvpn"
    destination: "/etc/openvpn"
    permissions: "rw"
    uid: 0

shared_data: []

env:
  - key: DOMAIN
    value: "%DOMAIN.DOMAIN%"
    template_type: instance

  - key: EXTERNAL_PORT
    value: "%PORTS|0.EXTERNAL%"
    template_type: instance

custom_fields:
  OPENVPN_USER:
    label: "VPN Username"
    type: dynamicText
    width: 6
    default_value: "admin"
    template_type: none
    validate:
      - required
      - alphanumeric
      - { minLength: 3 }
    params: {}

  OPENVPN_PASSWORD:
    label: "VPN Password"
    type: complexPassword
    width: 6
    default_value: null
    template_type: password
    validate:
      - required
      - complexPassword
    params: {}

  CONFIG_URL:
    label: "Config Download URL"
    type: externalURL
    width: 12
    default_value: "https://%DOMAIN.DOMAIN%/"
    template_type: instance
    validate: []
    params: {}

advanced:
  devices: []
  ulimits: []
  sysctls: []
  chains: []
